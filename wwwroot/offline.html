<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#202841" />
    <meta name="robots" content="noindex" />
    <title>You're offline – Amal Collection</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 24px; background: #faf8f5; color: #23201b;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        .card {
            width: 100%; max-width: 440px; text-align: center;
            background: #fff; border: 1px solid #e6e0d6; border-radius: 18px;
            padding: 40px 28px; box-shadow: 0 18px 48px rgba(35, 32, 27, 0.08);
        }
        .mark {
            width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
            display: grid; place-items: center; background: #202841; color: #c9a75e;
            font: 700 34px/1 Georgia, "Times New Roman", serif;
        }
        .brand {
            font: 700 0.72rem/1 "Segoe UI", system-ui, sans-serif; letter-spacing: 0.22em;
            text-transform: uppercase; color: #8a7a5c; margin: 0 0 10px;
        }
        h1 { font: 700 1.55rem/1.25 Georgia, "Times New Roman", serif; margin: 0 0 12px; }
        p { margin: 0 0 24px; color: #5c554a; line-height: 1.6; font-size: 0.95rem; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 22px; border-radius: 999px; border: 1px solid #202841;
            background: #202841; color: #fff; font-weight: 600; font-size: 0.9rem;
            text-decoration: none; cursor: pointer;
        }
        .btn.ghost { background: transparent; color: #202841; }
        .hint { margin: 20px 0 0; font-size: 0.78rem; color: #8a8378; }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true">A</div>
        <p class="brand">Amal Collection</p>
        <h1>You're offline</h1>
        <p>It looks like your internet connection dropped. Your cart is safe — reconnect and continue where you left off.</p>
        <div class="actions">
            <button class="btn" type="button" onclick="location.reload()">Try again</button>
            <a class="btn ghost" href="/">Go to home</a>
        </div>
        <p class="hint">Still stuck? WhatsApp us at 0321-6068091 when you're back online.</p>
    </main>
</body>
</html>
